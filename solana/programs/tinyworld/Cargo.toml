[package]
name = "tinyworld"
version = "0.1.0"
description = "TinyWorld Solana: soulbound DID identity + equipment (Token-2022)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tinyworld"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
# 固定 solana 2.1 线：与 anchor 0.31 设计目标一致，MSRV=1.75 可被
# solana 1.18 的 cargo-build-sbf（platform-tools v1.39 / rust 1.75）编译
solana-program = "~2.1"
# blake3 1.8 起转向 digest 0.11 / crypto-common 0.2（edition 2024），
# cargo 1.75（platform-tools v1.39）无法解析，固定 1.7 线
blake3 = "~1.7"
# zeroize_derive 1.5 起 edition 2024，固定 1.4
zeroize_derive = "~1.4"
# proc-macro-crate 3.5 起依赖 toml_edit 0.25 / toml_datetime 1.1（edition 2024 链），固定 3.4
proc-macro-crate = "=3.2.0"
indexmap = "~2.9"
unicode-segmentation = "=1.12.0"
borsh = "~1.5"
borsh-derive = "~1.5"
thiserror = "=2.0.0"
serde = "=1.0.218"
